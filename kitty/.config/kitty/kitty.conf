# ==============================================================================
# ML4W-INSPIRED KITTY CONFIGURATION
# Save to: ~/.config/kitty/kitty.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FONTS & TYPOGRAPHY
# ------------------------------------------------------------------------------
font_family      family="JetBrains Mono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0
disable_ligatures never

# Adjust line height and column spacing for a spacious feel
modify_font line_height 110%
modify_font column_width 100%

# ------------------------------------------------------------------------------
# 2. WINDOW LAYOUT & PADDING
# ------------------------------------------------------------------------------
window_padding_width 12
confirm_os_window_close 0

# Hide title bar while keeping window borders
hide_window_decorations yes
draw_minimal_borders yes
window_border_width 1.0pt
active_border_color #7aa2f7
inactive_border_color #292e42

# Enable layout options
enabled_layouts splits,stack

# ------------------------------------------------------------------------------
# 3. CURSOR & MOUSE
# ------------------------------------------------------------------------------
cursor #c0caf5
cursor_text_color #1a1b26
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

mouse_hide_wait 3.0
url_color #73daca
url_style curly
open_url_with default
detect_urls yes

# ------------------------------------------------------------------------------
# 4. TAB BAR STYLING (ML4W / Powerline Style)
# ------------------------------------------------------------------------------
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{index}: {title}"

active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
active_tab_font_style   bold
inactive_tab_foreground #545c7e
inactive_tab_background #1f2335
inactive_tab_font_style normal

# ------------------------------------------------------------------------------
# 5. COLOR SCHEME (Tokyo Night Theme)
# ------------------------------------------------------------------------------
foreground                  #a9b1d6
background                  #1a1b26
selection_foreground        #c0caf5
selection_background        #33467c

# Black
color0 #15161e
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2  #9ece6a
color10 #9ece6a

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #c0caf5
color15 #c0caf5

# Background transparency (adjust as desired)
background_opacity 0.92
dynamic_background_opacity yes

# ------------------------------------------------------------------------------
# 6. KEYBINDINGS
# ------------------------------------------------------------------------------
# Clear default bindings to avoid conflicts
clear_all_shortcuts yes

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font sizing
map ctrl+plus  change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# Tab management
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+tab     next_tab
map ctrl+shift+tab previous_tab

# Window Splitting (Similar to Tmux split bindings)
map ctrl+shift+pipe launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current

# Window Navigation
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# Miscellaneous
map ctrl+shift+r load_config_file
map ctrl+shift+u kitten unicode_input
