# Starship Tokyo Night Theme Configuration
# Matches Kitty, Tmux, and COSMIC Terminal palette

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$golang\
$rust\
$nodejs\
$python\
$cmd_duration\
$line_break\
$character"""

palette = "tokyo_night"

[palettes.tokyo_night]
bg = "#1a1b26"
fg = "#a9b1d6"
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"
gray = "#414868"

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold magenta"
symbol = " "
format = "on [$symbol$branch]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = " "
modified = " "
staged = "● "
renamed = "» "
deleted = "✘ "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
vimcmd_replace_one_symbol = "[❮](bold magenta)"
vimcmd_replace_symbol = "[❮](bold magenta)"
vimcmd_visual_symbol = "[❮](bold cyan)"

[cmd_duration]
min_time = 2_000
style = "yellow"
format = "took [$duration]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "🦀 "
style = "bold red"
format = "via [$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[python]
symbol = "🐍 "
style = "bold yellow"
format = "via [${symbol}${pyenv_prefix}(${version} )]($style)"
