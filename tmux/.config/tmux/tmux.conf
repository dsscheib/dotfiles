set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g default-shell /usr/bin/fish

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# set -g @catppuccin_flavour 'mocha'
# set -g @monokai-show-powerline true

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'

# set -g @plugin 'fabioluciano/tmux-tokyo-night'
# set -g @plugin 'maxpetretta/tmux-monokai-pro'
# set -g @plugin "nordtheme/tmux"
# set -g @plugin 'egel/tmux-gruvbox'

### Gruvbox Theme configuration
# set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'

### Tokyo Night Theme configuration
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_plugins "datetime,battery,cpu,memory,git,hostname"
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"
set -g @powerkit_separator_style "normal"  # or normal, flame, pixel, honeycomb, rounded
set -g @powerkit_edge_separator_style "normal"
set -g @powerkit_status_interval "5"
set -g @powerkit_status_position "bottom"
set -g @powerkit_transparent "true"
# set -g @powerkit_keybinding_conflict_action "ignore"
# Global keybindings
set -g @powerkit_options_key "C-o"
set -g @powerkit_keybindings_key "C-k"
set -g @powerkit_theme_selector_key "C-t"
set -g @powerkit_bar_layout "single"

# set -g @theme_variation 'night'
# set -g @theme_left_separator ''
# set -g @theme_right_separator ''
# set -g @theme_plugins 'datetime,weather'
# set -g @theme_transparent_status_bar 'true'
# set -g @theme_plugin_weather_location 'Merion Station, United States'


# set status-right
set -g @tmux-gruvbox-right-status-x '%a %h-%d-%Y' # e.g.: Wed Jun 04 2025
set -g @tmux-gruvbox-right-status-z '#{battery_status_bg} Batt: #{battery_icon} #{battery_percentage} #{battery_remain}'


# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

unbind '"'
bind _ split-window -v -c "#{pane_current_path}"
unbind %
bind | split-window -h -c "#{pane_current_path}"

# run '/usr/share/tmux-plugin-manager/tpm'
# run '~/.tmux/plugins/tpm/tpm'
run '~/.config/tmux/plugins/tpm/tpm'
