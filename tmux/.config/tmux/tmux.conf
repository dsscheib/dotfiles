# ==============================================================================
# GENERAL OPTIONS
# ==============================================================================
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{1}%d;%p1%{2}%d;%p1%{3}%dm'
set -s set-clipboard on
set -g mouse on
set -s escape-time 0
set -g focus-events on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shell & Vi Mode
set -g default-shell "${SHELL}"
set-window-option -g mode-keys vi

# ==============================================================================
# KEYBINDINGS
# ==============================================================================
# Prefix key (C-Space)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Config reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# Intuitive Pane Splitting
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Fast Pane Resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt-arrow / Shift-arrow window & pane navigation
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# Copy Mode (Vi)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==============================================================================
# PLUGINS & THEME
# ==============================================================================
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf|agy)(diff)?(-wrapped)?'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'

# Tokyo Night Powerkit Setup
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_plugins "datetime,battery,cpu,memory,git,hostname"
set -g @powerkit_plugin_datetime_format "datetime-us"
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"
set -g @powerkit_separator_style "normal"
set -g @powerkit_edge_separator_style "normal"
set -g @powerkit_status_interval "15"
set -g @powerkit_status_position "bottom"
set -g @powerkit_transparent "true"
set -g @powerkit_keybinding_conflict_action "ignore"

# Auto-restore session state on startup
set -g @continuum-restore 'on'

# Run TPM
run '~/.local/share/tmux/plugins/tpm/tpm'
